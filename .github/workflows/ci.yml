name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jobraft
          POSTGRES_USER: jobraft
          POSTGRES_PASSWORD: jobraft
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobraft -d jobraft"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Test
        env:
          JOBRAFT_TEST_DATABASE_URL: postgres://jobraft:jobraft@localhost:5432/jobraft?sslmode=disable
        run: scripts/ci-test.sh go test ./...
      # Exercises the store-cost harness against a real server so the seeding
      # and measurement code cannot rot unnoticed. The numbers themselves are
      # read from a local run (scripts/store-cost.sh), not from CI logs.
      - name: Measure store operations (depth 1000)
        env:
          JOBRAFT_TEST_DATABASE_URL: postgres://jobraft:jobraft@localhost:5432/jobraft?sslmode=disable
          JOBRAFT_BENCH_CLAIM: '1'
        run: scripts/ci-test.sh go test ./internal/store -run 'TestPostgresOperationCost/(depth1000|dependencies)' -v -count=1
      - name: Race test
        env:
          JOBRAFT_TEST_DATABASE_URL: postgres://jobraft:jobraft@localhost:5432/jobraft?sslmode=disable
        run: scripts/ci-test.sh go test -race ./...
      - name: Build
        run: go build ./...
